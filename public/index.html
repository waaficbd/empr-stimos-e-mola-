<!DOCTYPE html>
<html lang="pt-MZ">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculadora de Empréstimos e-Mola</title>

    <!-- ✅ Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            font-family: -apple-system, sans-serif;
            background-color: #f1f3f5;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-header {
            width: 100%;
            background: linear-gradient(to bottom, #ff6600, #ff8500);
            padding: 20px 20px 40px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            box-sizing: border-box;
        }

        .card {
            background: white;
            width: 92%;
            max-width: 450px;
            margin-top: -25px;
            padding: 30px 20px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            box-sizing: border-box;
        }

        h2 {
            font-size: 22px;
            color: #333;
            margin: 0 0 5px;
            text-align: center;
        }

        .subtext {
            font-size: 11px;
            color: #888;
            text-align: center;
            margin-bottom: 30px;
        }

        .slider-section { margin-bottom: 25px; }

        .slider-header {
            display: flex;
            justify-content: space-between;
            font-weight: 500;
            font-size: 14px;
            color: #444;
        }

        .orange-text { color: #ff6600; font-weight: bold; }

        input[type=range] {
            width: 100%;
            accent-color: #ff6600;
            margin: 15px 0;
            height: 6px;
        }

        .slider-footer {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #bbb;
        }

        .result-container {
            background: #fafafa;
            border: 1px solid #f0f0f0;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            margin: 25px 0;
        }

        .result-value {
            color: #ff6600;
            font-size: 32px;
            font-weight: bold;
            margin: 0;
        }

        .btn-apply {
            background: linear-gradient(to right, #ff6600, #ff8500);
            color: white;
            border: none;
            width: 100%;
            padding: 18px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .footer {
            text-align: center;
            font-size: 11px;
            color: #ccc;
            margin: 30px 0;
        }
    </style>
</head>

<body>

<div class="app-header">
    <span>e-Mola</span>
    <span>☰</span>
</div>

<div class="card">
    <h2>Obtenha um Empréstimo Rápido</h2>
    <div class="subtext">Aprovação rápida • Taxas competitivas • Prazos flexíveis</div>

    <div class="slider-section">
        <div class="slider-header">
            <span>Valor do Empréstimo</span>
            <span id="valAmt" class="orange-text">1.500 MT</span>
        </div>
        <input type="range" id="amt" min="500" max="100000" step="500" value="1500">
        <div class="slider-footer"><span>500 MT</span><span>100.000 MT</span></div>
    </div>

    <div class="slider-section">
        <div class="slider-header">
            <span>Prazo do Empréstimo</span>
            <span id="valDur" class="orange-text">10 meses</span>
        </div>
        <input type="range" id="dur" min="1" max="24" step="1" value="10">
        <div class="slider-footer"><span>1 mês</span><span>24 meses</span></div>
    </div>

    <div class="result-container">
        <p style="margin:0; font-size:14px; color:#666">Prestação Mensal</p>
        <p id="monthly" class="result-value">177,00 MT</p>
    </div>

    <button class="btn-apply" onclick="goToPage2()">SOLICITAR AGORA</button>
</div>

<div class="footer">© 2026 e-Mola Moçambique</div>

<script>
    function update() {
        const amtEl = document.getElementById('amt');
        const durEl = document.getElementById('dur');

        if (!amtEl || !durEl) return;

        const amount = Number(amtEl.value) || 0;
        const duration = Number(durEl.value) || 1;

        const labelMonth = duration === 1 ? 'mês' : 'meses';

        document.getElementById('valAmt').innerText = `${amount.toLocaleString('pt-MZ')} MT`;
        document.getElementById('valDur').innerText = `${duration} ${labelMonth}`;

        const monthly = (amount * 1.18) / duration;
        document.getElementById('monthly').innerText = `${monthly.toFixed(2).replace('.', ',')} MT`;
    }

    function goToPage2() {
        const amtEl = document.getElementById('amt');
        const durEl = document.getElementById('dur');

        if (!amtEl || !durEl) return;

        const amount = Number(amtEl.value) || 0;
        const duration = Number(durEl.value) || 1;
        const monthly = Math.round((amount * 1.18) / duration);

        // ✅ Save raw values to matching keys for Page 9
        localStorage.setItem('loan_amount', amount);
        localStorage.setItem('loan_term', duration);
        localStorage.setItem('monthly_repayment', monthly);

        window.location.href = "/page2";
    }

    window.onload = () => {
        const tg = window.Telegram?.WebApp;

        if (tg) {
            tg.ready();
            tg.expand();
        }

        const amtEl = document.getElementById('amt');
        const durEl = document.getElementById('dur');

        if (amtEl) amtEl.addEventListener('input', update);
        if (durEl) durEl.addEventListener('input', update);

        update();
    };
</script>

</body>
</html>
